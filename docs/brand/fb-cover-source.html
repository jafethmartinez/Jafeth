<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family:"YoungSerif"; src:url("fonts/YoungSerif-Regular.ttf"); }
  @font-face { font-family:"InstrumentSans"; src:url("fonts/InstrumentSans-Regular.ttf"); font-weight:400; }
  @font-face { font-family:"InstrumentSans"; src:url("fonts/InstrumentSans-Bold.ttf"); font-weight:700; }

  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1640px; height:664px; overflow:hidden; background:#06232e; }

  .cover { position:relative; width:1640px; height:664px; overflow:hidden; }

  /* The sandbar sits centre-low in the source frame; pull the crop down a
     touch so the island and the reef both survive the 2.47:1 letterbox. */
  .cover img {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover; object-position:center 74%;
  }

  /* Legibility scrim. Deepest in the centre where the type sits, feathered
     out to the edges so the reef colour still reads at the corners. */
  .scrim {
    position:absolute; inset:0;
    background:
      linear-gradient(97deg, rgba(4,32,42,.78) 0%, rgba(4,32,42,.70) 40%, rgba(4,32,42,.30) 62%, rgba(4,32,42,0) 80%),
      linear-gradient(to top, rgba(4,32,42,.34) 0%, rgba(4,32,42,0) 30%);
  }

  /* Everything lives inside the mobile-safe centre column and clear of the
     lower-left corner, where the profile picture overlaps on desktop. */
  .inner {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
    text-align:left; color:#fff;
    padding:0 300px 0 408px;
  }

  .eyebrow {
    font-family:"InstrumentSans",sans-serif; font-weight:700;
    font-size:19px; letter-spacing:.26em; text-transform:uppercase;
    color:#a9ece5; margin-bottom:22px;
    text-shadow:0 1px 10px rgba(4,32,42,.6);
  }

  h1 {
    font-family:"YoungSerif",Georgia,serif; font-weight:400;
    font-size:62px; line-height:1.08; letter-spacing:-.015em;
    text-shadow:0 2px 26px rgba(4,32,42,.72);
    margin-bottom:26px;
  }

  .rule { width:70px; height:3px; background:#ffb703; border-radius:2px; margin-bottom:26px; }

  .sub {
    font-family:"InstrumentSans",sans-serif; font-weight:400;
    font-size:25px; line-height:1.5; color:rgba(255,255,255,.95);
    text-shadow:0 1px 14px rgba(4,32,42,.7);
  }
  .sub b { font-weight:700; }

  .site {
    margin-top:30px;
    font-family:"InstrumentSans",sans-serif; font-weight:700;
    font-size:20px; letter-spacing:.11em; text-transform:uppercase;
    color:rgba(255,255,255,.93);
    text-shadow:0 1px 12px rgba(4,32,42,.8);
  }
</style>

<div class="cover">
  <img src="pigeon-cay-drone.jpg" alt="">
  <div class="scrim"></div>
  <div class="inner">
    <div class="eyebrow">Roatán &middot; Bay Islands</div>
    <h1>Back aboard with<br>time to spare</h1>
    <div class="rule"></div>
    <div class="sub">
      Family-run shore excursions, planned around your ship's clock.<br>
      Pickup at <b>Isla Tropicale</b> and <b>Port of Roatán</b>.
      <div class="site">martinezeastendtours.com</div>
    </div>
  </div>
</div>
